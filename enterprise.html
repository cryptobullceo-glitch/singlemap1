<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signalmap for Teams — Custom Plans for Funds & Desks</title>
  <meta name="description" content="Signalmap for teams and funds. Custom pricing, multiple seats, and direct analyst support. Get in touch to discuss your needs.">
  <link rel="canonical" href="https://signalmap.live/enterprise">
  <meta property="og:title" content="Signalmap for Teams">
  <meta property="og:description" content="Custom plans for crypto funds, trading desks, and research teams.">
  <meta property="og:url" content="https://signalmap.live/enterprise">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://signalmap.live/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #059669; --green2: #34d399; --green-dark: #065f46; --ink: #0A0A0B;
      --paper: #F7F7F4; --mid: #6B7280; --light: #E4E4E1; --pale: #ECFDF5;
    }
    body { font-family: 'Inter', sans-serif; background: var(--paper); color: var(--ink); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
    nav { max-width: 900px; margin: 0 auto; width: 100%; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 60px; }
    .nav-logo { font-family: 'Space Grotesk', sans-serif; font-size: 1.1rem; font-weight: 700; text-decoration: none; color: var(--ink); }
    .nav-logo span { color: var(--green); }
    .nav-links { display: flex; align-items: center; gap: 24px; }
    .nav-links a { font-size: .875rem; color: var(--mid); text-decoration: none; }
    .nav-links a:hover { color: var(--ink); }
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 24px; }
    .wrap { max-width: 560px; width: 100%; }
    h1 { font-family: 'Space Grotesk', sans-serif; font-size: clamp(1.75rem, 4vw, 2.5rem); font-weight: 700; line-height: 1.2; margin-bottom: 12px; }
    h1 em { color: var(--green); font-style: normal; }
    .sub { font-size: 1rem; color: var(--mid); margin-bottom: 36px; }
    .form-card { background: #fff; border: 1px solid var(--light); border-radius: 16px; padding: 32px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .form-group label { font-size: .75rem; font-weight: 600; color: var(--mid); }
    .form-group input, .form-group select, .form-group textarea {
      background: var(--paper); border: 1px solid var(--light); border-radius: 8px;
      padding: 10px 14px; font-size: .875rem; color: var(--ink); font-family: inherit;
      outline: none; transition: border-color .2s;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--green); }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .submit-btn {
      width: 100%; background: var(--green); color: #fff; border: none; border-radius: 8px;
      padding: 13px; font-size: .95rem; font-weight: 700; cursor: pointer; font-family: inherit;
      transition: opacity .2s; margin-top: 4px;
    }
    .submit-btn:hover { opacity: .9; }
    .submit-btn:disabled { opacity: .5; cursor: not-allowed; }
    .form-success { text-align: center; padding: 32px 16px; display: none; }
    .form-success .icon { font-size: 2.5rem; margin-bottom: 12px; }
    .form-success h3 { font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; }
    .form-success p { color: var(--mid); font-size: .9rem; }
    footer { text-align: center; padding: 24px; font-size: .8rem; color: var(--mid); }
    footer a { color: var(--mid); text-decoration: none; }
    footer a:hover { color: var(--ink); }
    @media (max-width: 520px) { .form-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <nav>
    <a class="nav-logo" href="/"><span>Signal</span>map</a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/pricing">Pricing</a>
      <a href="/blog">Blog</a>
    </div>
  </nav>

  <main>
    <div class="wrap">
      <h1>Signalmap for <em>teams.</em></h1>
      <p class="sub">Need access for multiple people on your fund, desk, or research team? Get in touch and we'll put together a plan that fits.</p>

      <div class="form-card">
        <div id="contact-form-wrap">
          <div class="form-row">
            <div class="form-group">
              <label>Your name</label>
              <input type="text" id="ent-name" placeholder="Alex Chen">
            </div>
            <div class="form-group">
              <label>Work email</label>
              <input type="email" id="ent-email" placeholder="alex@fund.com">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Company / Fund</label>
              <input type="text" id="ent-company" placeholder="Apex Capital">
            </div>
            <div class="form-group">
              <label>Team size</label>
              <select id="ent-size">
                <option value="">Select…</option>
                <option>2–5 people</option>
                <option>6–20 people</option>
                <option>20+ people</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>What are you trying to do? (optional)</label>
            <textarea id="ent-notes" placeholder="e.g. track OKX and Binance for our crypto long/short fund…"></textarea>
          </div>
          <button class="submit-btn" id="ent-submit" onclick="submitEnterprise()">Send message →</button>
        </div>
        <div class="form-success" id="form-success">
          <div class="icon">✅</div>
          <h3>Got it — we'll be in touch.</h3>
          <p>Expect a reply within 24 hours.</p>
        </div>
      </div>
    </div>
  </main>

  <footer>
    © 2026 Signalmap &nbsp;·&nbsp; <a href="/">Home</a> &nbsp;·&nbsp; <a href="/pricing">Pricing</a> &nbsp;·&nbsp; <a href="/blog">Blog</a>
  </footer>

  <script>
    const SUPABASE_URL = 'https://ufrscgfutnjzfsvaxzmf.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmcnNjZ2Z1dG5qemZzdmF4em1mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDI4NDg4MDgsImV4cCI6MjA1ODQyNDgwOH0.RJck-TfcNk8-gGKi0YoHWfCWx4wFiCjsj6JRbNxqhPQ';

    async function submitEnterprise() {
      const name = document.getElementById('ent-name').value.trim();
      const email = document.getElementById('ent-email').value.trim();
      const company = document.getElementById('ent-company').value.trim();
      const size = document.getElementById('ent-size').value;
      const notes = document.getElementById('ent-notes').value.trim();

      if (!name || !email || !email.includes('@')) {
        alert('Please fill in your name and a valid email address.');
        return;
      }

      const btn = document.getElementById('ent-submit');
      btn.disabled = true;
      btn.textContent = 'Sending…';

      try {
        await fetch(`${SUPABASE_URL}/rest/v1/subscribers`, {
          method: 'POST',
          headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
          body: JSON.stringify({ email, name, source: 'enterprise', metadata: { company, size, notes } })
        });
      } catch (_) {}

      document.getElementById('contact-form-wrap').style.display = 'none';
      document.getElementById('form-success').style.display = 'block';
    }
  </script>
</body>
</html>
